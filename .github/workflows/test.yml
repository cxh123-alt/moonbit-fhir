name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moonbit:
    name: MoonBit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain
        run: |
          moon version --all
          moonc -v

      - name: Enforce MoonBit compiler minimum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="$(moonc -v | sed -n 's/^v\([0-9.]*\).*/\1/p')"
          test -n "$version"
          required="1009"
          actual="$(echo "$version" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')"
          test "$actual" -ge "$required"

      - name: Enforce MoonBit compiler minimum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = moonc -v
          $match = [regex]::Match($line, '^v(\d+)\.(\d+)\.(\d+)')
          if (-not $match.Success) { throw "Unable to parse moonc version: $line" }
          $actual = ([int]$match.Groups[1].Value * 10000) + [int]$match.Groups[2].Value * 100 + [int]$match.Groups[3].Value
          if ($actual -lt 1009) { throw "moonc $($match.Value) is below required v0.10.9" }

      - name: Format
        run: moon fmt --check

      - name: Check
        run: moon check --deny-warn

      - name: Test
        run: moon test --deny-warn

      - name: Info
        run: |
          moon info
          git diff --exit-code

      - name: CLI smoke test
        run: |
          moon run cmd/main -- --example patient
          moon run cmd/main -- --example observation
          moon run cmd/main -- --example bundle
          moon run cmd/main -- --summary '{"resourceType":"Patient","id":"ci"}'

  native:
    name: Native and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          moon version --all
          moonc -v

      - name: Enforce MoonBit compiler minimum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="$(moonc -v | sed -n 's/^v\([0-9.]*\).*/\1/p')"
          test -n "$version"
          required="1009"
          actual="$(echo "$version" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')"
          test "$actual" -ge "$required"

      - name: Enforce MoonBit compiler minimum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = moonc -v
          $match = [regex]::Match($line, '^v(\d+)\.(\d+)\.(\d+)')
          if (-not $match.Success) { throw "Unable to parse moonc version: $line" }
          $actual = ([int]$match.Groups[1].Value * 10000) + ([int]$match.Groups[2].Value * 100) + [int]$match.Groups[3].Value
          if ($actual -lt 1009) { throw "moonc $($match.Value) is below required v0.10.9" }

      - name: Native check
        run: moon check --target native --deny-warn

      - name: Native tests
        run: moon test --target native --deny-warn

      - name: Coverage
        run: |
          moon test --enable-coverage
          moon coverage report -f summary
          moon coverage analyze
